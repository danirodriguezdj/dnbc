<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Archivo: contact.html
    Propósito: Página de contacto de DNBC Agency.
    Estándar de documentación: ISO/IEC/IEEE 26515
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>Contact – DNBC</title>
  <meta name="description" content="Contact DNBC for bookings and information." />
  <meta name="author" content="DNBC Team" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DNBC" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      min-width: 100vw;
      max-height: 100vh;
      max-width: 100vw;
      overflow: hidden !important;
      position: relative;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      text-align: center;
      padding: 0;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      min-width: 100vw;
      max-height: 100vh;
      max-width: 100vw;
      overflow: hidden !important;
      position: relative;
    }
    /* Botón hamburguesa para mobile/desktop */
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }
    /* Sidebar oculto por defecto, aparece al clicar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: #111;
      padding-top: 60px;
      transition: left .3s ease;
      z-index: 1000;
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar ul {
      list-style: none;
    }
    .sidebar a {
      display: block;
      color: #fff;
      padding: 20px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid #222;
    }
    .sidebar a:hover {
      background: #222;
    }
    /* Header fijo con logo centrado */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a {
      display: flex;
      align-items: center;
      height: 100%;
    }
    header .logo {
      max-width: 400px;
      width: 80vw;
      height: auto;
    }
    main.contact-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-width: 100vw;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .contact-card {
      background: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      max-width: 98vw;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .contact-card h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
      margin-top: 0;
    }
    .contact-card .intro {
      font-size: 1.15rem;
      margin-bottom: 32px;
      color: #ccc;
      letter-spacing: 1px;
      white-space: pre-line;
    }
    .contact-list {
      width: 100%;
      max-width: 380px;
      text-align: center;
      margin: 0 auto;
      padding: 0;
    }
    .contact-list li {
      font-size: 1.05rem;
      margin: 24px 0 0 0;
      list-style: none;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .contact-list strong {
      color: #fff;
      letter-spacing: 1px;
      font-weight: bold;
      font-size: 1.07em;
    }
    .contact-list .plain {
      color: #fff;
      font-size: 1.07em;
      margin-top: 2px;
    }
    .contact-list a,
    .contact-list .contact-red {
      color: #ff0033 !important;
      text-decoration: none;
      word-break: break-all;
      font-family: inherit;
      font-size: 1.08em;
      margin-top: 2px;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .contact-list a:hover {
      text-decoration: underline;
      color: #ff3355 !important;
    }
    @media (max-width: 700px) {
      header {
        justify-content: space-between;
        padding: 0 20px;
        height: 65px;
      }
      header a {
        margin-left: auto;
      }
      header .logo {
        max-width: 250px;
        width: 60vw;
      }
      .contact-card h1 {
        font-size: 1.3rem;
      }
      .contact-card .intro {
        font-size: 1rem;
      }
      .contact-list {
        max-width: 98vw;
      }
    }
    @media (max-width: 500px) {
  html, body, main.contact-main {
    min-height: 100vh !important;
    height: 100vh !important;
    max-height: 100vh !important;
    overflow: hidden !important;
    width: 100vw !important;
    max-width: 100vw !important;
    min-width: 100vw !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .contact-card {
    padding: 0 7vw;
  }
  .contact-card h1 {
    font-size: 1.1rem;
  }
  .contact-card .intro {
    font-size: 0.95rem;
  }
  .contact-list {
    font-size: 1rem;
    max-width: 100vw;
    padding: 0 2vw;
  }
  .contact-list li {
    font-size: 1rem;
    margin: 22px 0 0 0;
  }
  .contact-list a,
  .contact-list .contact-red {
    font-size: 0.70em !important;         /* ¡Reduce este valor hasta que quepa! */
    white-space: nowrap !important;       /* No permite saltos de línea */
    word-break: normal !important;        /* No parte la palabra */
    overflow: hidden !important;          /* Opcional: oculta el exceso */
    text-overflow: ellipsis !important;   /* Opcional: muestra "..." si no cabe */
    max-width: 96vw;                      /* Limita el ancho máximo */
    display: inline-block;
  }
}
  </style>
</head>
<body>
  <!-- Botón para abrir/cerrar menú lateral -->
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  
  <!-- Navegación lateral -->
  <div id="menu-container"></div>
  
  <!-- Header fijo con logo -->
  <header>
    <a href="https://dienachtbrenntclub.com" rel="noopener">
      <img src="/logoletraslargo.png" alt="DNBC Agency logo" class="logo" />
    </a>
  </header>
  
  <main class="contact-main">
    <div class="contact-card">
      <h1>Need Something?</h1>
      <div class="intro">
we´re here to help you.
for bookings, collaborations or any questions,
contact us
      </div>
      <ul class="contact-list">
        <li>
          <strong>e-mail</strong>
          <a href="mailto:agency@dienachtbrenntclub.com" class="contact-red">agency@dienachtbrenntclub.com</a>
        </li>
        <li>
          <strong></strong>
          <span class="plain"></span>
          <a href="" class="contact-red"></a>
        </li>
      </ul>
    </div>
  </main>
  <script>
  (function() {
    'use strict';
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Carga el menú desde menu.html
      fetch('/menu.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('menu-container').innerHTML = html;
          // 2. Después de insertar el menú, añade el evento al botón hamburguesa
          var btn = document.querySelector('.menu-toggle');
          var nav = document.getElementById('sidebar');
          btn.addEventListener('click', function() {
            nav.classList.toggle('open');
          });
        });
    });
  })();
  </script>
</body>
</html>
