<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>Contact – DNBC Agency</title>
  <meta name="description" content="Contact DNBC Agency for bookings and information." />
  <meta name="author" content="DNBC Team" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DNBC" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a {
      display: flex;
      align-items: center;
      height: 100%;
    }
    header .logo {
      max-width: 400px;
      width: 80vw;
      height: auto;
    }
    main.contact-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      margin: 0;
    }
    .contact-card {
      background: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      max-width: 98vw;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .contact-card h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
      margin-top: 0;
    }
    .contact-card p {
      font-size: 1.15rem;
      margin-bottom: 32px;
      color: #ccc;
      letter-spacing: 1px;
    }
    .contact-list {
      width: 100%;
      max-width: 340px;
      text-align: center;
      margin: 0 auto;
      padding: 0;
    }
    .contact-list li {
      font-size: 1.05rem;
      margin: 22px 0 0 0;
      list-style: none;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .contact-list strong {
      color: #fff;
      letter-spacing: 1px;
      font-weight: bold;
      font-size: 1.07em;
    }
    .contact-list a, .contact-list .plain {
      color: #e1306c;
      text-decoration: none;
      word-break: break-all;
      font-family: inherit;
      font-size: 1.08em;
      margin-top: 2px;
    }
    .contact-list a:hover {
      text-decoration: underline;
    }
    @media (max-width: 700px) {
      header {
        height: 60px;
      }
      header .logo {
        max-width: 250px;
        width: 60vw;
      }
      .contact-card h1 {
        font-size: 1.3rem;
      }
      .contact-card p {
        font-size: 1rem;
      }
      .contact-list {
        max-width: 95vw;
      }
    }
    @media (max-width: 500px) {
      body, html {
        height: 100vh;
        max-height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }
      main.contact-main {
        min-height: 100vh;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      .contact-card {
        padding: 0 2vw;
      }
      .contact-card h1 {
        font-size: 1.1rem;
      }
      .contact-card p {
        font-size: 0.95rem;
      }
      .contact-list {
        font-size: 1rem;
      }
      .contact-list li {
        font-size: 1rem;
        margin: 20px 0 0 0;
      }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  <div id="menu-container"></div>
  <header>
    <a href="https://dienachtbrenntclub.com" rel="noopener">
      <img src="/logoletraslargo.png" alt="DNBC Agency logo" class="logo" />
    </a>
  </header>
  <main class="contact-main">
    <div class="contact-card">
      <h1>Need Something?</h1>
      <p>We're here to help you.<br>
      For bookings, collaborations or any questions, contact us:</p>
      <ul class="contact-list">
        <li>
          <strong>E-mail</strong>
          <a href="mailto:agency@dienachtbrenntclub.com">agency@dienachtbrenntclub.com</a>
        </li>
        <li>
          <strong>Artist Manager (Giulia Nigro)</strong>
          <a href="tel:+351930666328">+351 930 666 328</a>
        </li>
        <li>
          <strong>DNBC Contact</strong>
          <a href="tel:+34634765795">+34 634 76 57 95</a>
        </li>
      </ul>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Carga el menú hamburguesa desde menu.html
      fetch('/menu.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('menu-container').innerHTML = html;
          // Activa el menú hamburguesa después de cargar el menú
          const btn = document.querySelector('.menu-toggle');
          const nav = document.getElementById('sidebar');
          btn.addEventListener('click', () => {
            nav.classList.toggle('open');
          });
        });
    });
  </script>
</body>
</html>
