<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>Contact – DNBC Agency</title>
  <meta name="description" content="Contact DNBC Agency for bookings and information." />
  <meta name="author" content="DNBC Team" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DNBC" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a {
      display: flex;
      align-items: center;
      height: 100%;
    }
    header .logo {
      max-width: 400px;
      width: 80vw;
      height: auto;
    }
    main.contact-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      width: 100%;
      margin-top: 90px;
      margin-bottom: 40px;
    }
    .contact-card {
      background: rgba(20,20,20,0.85);
      border-radius: 14px;
      box-shadow: 0 2px 24px 0 rgba(0,0,0,.18);
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .contact-card h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .contact-card p {
      font-size: 1.15rem;
      margin-bottom: 28px;
      color: #ccc;
      letter-spacing: 1px;
    }
    .contact-list {
      width: 100%;
      text-align: left;
      margin-bottom: 15px;
    }
    .contact-list li {
      font-size: 1.04rem;
      margin: 10px 0 10px 0;
      list-style: none;
      line-height: 1.6;
    }
    .contact-list strong {
      color: #fff;
      letter-spacing: 1px;
    }
    .contact-list a, .contact-list .plain {
      color: #e1306c;
      text-decoration: none;
      word-break: break-all;
      font-family: inherit;
      font-size: inherit;
    }
    .contact-list a:hover {
      text-decoration: underline;
    }
    @media (max-width: 700px) {
      .contact-card {
        padding: 20px 6vw;
        max-width: 98vw;
      }
      .contact-card h1 {
        font-size: 1.4rem;
      }
      .contact-card p {
        font-size: 1rem;
      }
      main.contact-main {
        margin-top: 70px;
      }
    }
    .footer-link-dock {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(20, 20, 20, 0.75);
      border-radius: 32px;
      padding: 10px 32px;
      box-shadow: 0 6px 24px 4px rgba(0,0,0,0.35);
      border: 1.5px solid #333;
      backdrop-filter: blur(2px);
      font-family: 'horizon', sans-serif;
      font-size: 1.12rem;
      letter-spacing: 1px;
      transition: background 0.2s;
      z-index: 2000;
    }
    .footer-link-dock a {
      color: #fff;
      text-decoration: none;
      font-family: 'horizon', sans-serif;
      font-size: 1.15rem;
      transition: color 0.2s, filter 0.2s;
      display: flex;
      align-items: center;
    }
    .footer-link-dock a:hover {
      color: #e1306c;
      filter: drop-shadow(0 0 6px #e1306c70);
    }
  </style>
</head>
<body>
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  <div id="menu-container"></div>
  <header>
    <a href="https://dienachtbrenntclub.com" rel="noopener">
      <img src="/logoletraslargo.png" alt="DNBC Agency logo" class="logo" />
    </a>
  </header>
  <main class="contact-main">
    <div class="contact-card">
      <h1>Need Something?</h1>
      <p>We're here to help you.<br>
      For bookings, collaborations or any questions, contact us:</p>
      <ul class="contact-list">
        <li><strong>Email:</strong>
          <a href="mailto:agency@dienachtbrenntclub.com">agency@dienachtbrenntclub.com</a>
        </li>
        <li><strong>Artist Manager (Giulia Nigro):</strong>
          <a href="tel:+351930666328">+351 930 666 328</a>
        </li>
        <li><strong>DNBC Contact:</strong>
          <a href="tel:+34634765795">+34 634 76 57 95</a>
        </li>
      </ul>
    </div>
  </main>
  <div class="footer-link-dock">
    <a href="https://instagram.com/dnbcagency" target="_blank" rel="noopener">@dnbcagency</a>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Carga el menú hamburguesa desde menu.html
      fetch('/menu.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('menu-container').innerHTML = html;
          // Activa el menú hamburguesa después de cargar el menú
          const btn = document.querySelector('.menu-toggle');
          const nav = document.getElementById('sidebar');
          btn.addEventListener('click', () => {
            nav.classList.toggle('open');
          });
        });
    });
  </script>
</body>
</html>
