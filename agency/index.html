  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');

    }
    *, *::before, *::after {

      margin: 0;
      padding: 0;
    }

    /* RESTAURADO: body padding original de la versión agency (sin el espaciado grande que venía en main) */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;

    /* Botón hamburguesa (COPIADO EXACTO) */
    .menu-toggle {

      background: none;

      cursor: pointer;

    }

    .sidebar a {
      display: block;
      color: #fff;

  <!-- styles específicos para la página de Agency (grid, tarjetas, banner Giulia, adaptabilidad) -->
  <style>
    :root {
      --artist-gap: 6px;
      --card-width: 180px;
      --card-height: 240px;
      --page-padding-x: 8px;
    }

    main.container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 0; /* JS actualizará esto en runtime para que el contenido quede debajo del header */
      z-index: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2.section-title {
      margin: 18px 0 8px;
      font-size: 1.6rem;
      letter-spacing: 2px;
    }

    /* Banner Giulia: ancho igual al grid; altura 70% de la tarjeta
       margin-top reducido (JS aplica padding en el contenedor para separarlo del header) */
    .artist.manager-banner {
      position: relative;
      overflow: hidden;
      border-radius: 0; /* removed rounded corners for Giulia */
      display: block;
      cursor: pointer;
      background: #181818;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.18);
      width: calc( (var(--card-width) * 4) + (var(--artist-gap) * 3) );
      /* allow the JS-set width to take precedence and avoid double-limiting on small screens */
      max-width: none;
      height: calc(var(--card-height) * 0.70);
      transition: width .18s ease, height .18s ease, margin .12s ease;
      margin: 4px auto 4px auto; /* margen pequeño: la separación del header la maneja main.container padding */
    }
    .artist.manager-banner img.base,
    .artist.manager-banner img.playing {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
      border-radius: 0; /* ensure images have no rounded corners */
    }
    .manager-name-title {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
    }
    .manager-name-title span {
      display: block;
      width: 100%;
      text-align: center;
      font-family: 'horizon', sans-serif;
      color: #fff;
      text-shadow: 0 2px 14px #000, 0 0 6px #222;
      font-size: 1rem !important;
      font-weight: normal;
      letter-spacing: 2px;
      margin: 12px 0 0 0;
      line-height: 1.1;
    }
    .artist.manager-banner .artist-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 8px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity .3s;
      z-index: 3;
      text-align: center;
      border-radius: 0;
    }
    .artist.manager-banner:hover .artist-info { opacity: 1; }

    /* Tarjetas de artista: rectangulares, sin redondeado */
    .artist {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 0;
      display: block;
    }
    .artist img.base {
      width: var(--card-width);
      height: var(--card-height);
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
      object-fit: cover;
      border-radius: 0;
    }
    .artist img.playing {
      position: absolute;
      top: 0; left: 0;
      width: var(--card-width);
      height: var(--card-height);
      opacity: 0;
      transition: opacity .3s, transform .3s, filter .3s;
      object-fit: cover;
    }
    .artist:hover img.base { opacity: 0; filter: brightness(.5); transform: scale(1.05); }
    .artist:hover img.playing { opacity: 1; filter: brightness(.5); transform: scale(1.05); }

    /* AQUI: subimos z-index y levantamos ligeramente el overlay para que no quede tapado por el dock */
    .artist-info {
      position: absolute;
      bottom: 12px; /* <-- se sube un poco para evitar solapamiento con la zona inferior */
      left: 0;
      width: var(--card-width);
      padding: 8px;
      background: rgba(0,0,0,.7);
      opacity: 0;
      transition: opacity .2s;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      z-index: 2101; /* <-- mayor que el dock (2000) para que el overlay quede por encima */
    }
    .artist:hover .artist-info { opacity: 1; }

    /* GRID: columnas dinámicas según CSS/JS (desktop 4, móvil 3) */
    main.artist-grid {
      display: grid;
      grid-template-columns: repeat(4, var(--card-width));
      gap: var(--artist-gap);
      width: calc((var(--card-width) * 4) + (var(--artist-gap) * 3));
      max-width: calc(100% - (var(--page-padding-x) * 2));
      justify-content: center;
      margin: 8px 0 28px 0;
    }

    /* Móvil: 3 columnas, ARTISTS más pequeño (50%) */
    @media (max-width: 700px) {
      main.artist-grid {
        grid-template-columns: repeat(3, var(--card-width));
        width: calc((var(--card-width) * 3) + (var(--artist-gap) * 2));
      }
      h2.section-title {
        font-size: 0.8rem; /* ~50% of 1.6rem */
      }
      :root { --artist-gap: 5px; --page-padding-x: 10px; }
      body { padding: 0 10px 120px; } /* <-- móvil también aumentado */
      /* margin pequeño; spacing below header handled via JS applied padding on main.container */
      .artist.manager-banner { margin-bottom: 6px; }
    }

    /* Footer bubble original de agency con @dnbcagency (restaurado; ÚNICO dock) */
    .footer-link-dock {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(20, 20, 20, 0.75);
      border-radius: 21px;
      padding: 7px 21px;
      box-shadow: 0 6px 24px 4px rgba(0,0,0,0.35);
      border: 1.5px solid #333;
      backdrop-filter: blur(2px);
      font-family: 'horizon', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      transition: background 0.2s;
      z-index: 2000;
    }
    .footer-link-dock a {
      color: #fff;
      text-decoration: none;
      font-family: 'horizon', sans-serif;
      font-size: 0.77rem;
      transition: color 0.2s, filter 0.2s;
      display: flex;
      align-items: center;
    }
    .footer-link-dock a:hover {
      color: #e1306c;
      filter: drop-shadow(0 0 6px #e1306c70);
    }
  </style>

  <!-- Script que calcula tamaños para que todo se adapte al viewport -->
  <script>
  (function () {
    'use strict';

    function applyLayout() {
      var vh = window.innerHeight;
      var vw = window.innerWidth;

      var header = document.querySelector('header');
      var footer = document.getElementById('footer-link-dock');
      var grid = document.getElementById('artist-grid');
      var giulia = document.getElementById('giulia-banner');
      var container = document.getElementById('main-container');

      var headerH = header ? header.offsetHeight : 75;
      var footerH = footer ? footer.offsetHeight : 50;
      var extraVertical = 30; // espacio para títulos/gaps

      // decidir columnas según ancho (móvil 3, desktop 4)
      var columns = (vw <= 700) ? 3 : 4;

      // contar artistas
      var artistCount = 0;
      if (grid) artistCount = grid.querySelectorAll('.artist').length || 0;
      if (artistCount <= 0) artistCount = 8; // fallback

      // filas necesarias para artistas
      var artistRows = Math.ceil(artistCount / columns);

      // total de filas verticales = banner (si existe) + artistRows
      var totalRows = (giulia ? 1 : 0) + artistRows;

      // gap desde CSS
      var computed = getComputedStyle(document.documentElement);
      var gap = parseInt(computed.getPropertyValue('--artist-gap')) || 6;
      var pagePaddingX = parseInt(computed.getPropertyValue('--page-padding-x')) || 8;

      // Espacio vertical disponible
      var availableHeight = vh - headerH - footerH - extraVertical;
      if (availableHeight < 120) availableHeight = Math.max(120, vh - headerH - footerH);

      // altura máxima por tarjeta para que quepan `totalRows` filas
      var maxCardHeightByHeight = Math.floor(availableHeight / Math.max(1, totalRows));

      // restricción horizontal: calcular ancho máximo por columna
      var totalGapsWidth = gap * (columns - 1);
      var availableWidth = vw - (pagePaddingX * 2);
      var maxCardWidthByWidth = Math.floor((availableWidth - totalGapsWidth) / columns);
      if (maxCardWidthByWidth < 40) maxCardWidthByWidth = 40;

      // relación 3/4 -> height = width * 4/3
      var heightFromWidth = Math.floor(maxCardWidthByWidth * (4/3));

      // elegir altura de tarjeta respetando ambas restricciones
      var cardHeight = Math.min(maxCardHeightByHeight, heightFromWidth);
      if (cardHeight < 60) cardHeight = 60;

      var cardWidth = Math.floor(cardHeight * (3/4));
      if (cardWidth < 40) cardWidth = 40;

      // si el grid total excede el ancho, reducir cardWidth
      var totalGridWidth = (cardWidth * columns) + (gap * (columns - 1));
      if (totalGridWidth > availableWidth) {
        cardWidth = Math.floor((availableWidth - (gap * (columns - 1))) / columns);
        if (cardWidth < 40) cardWidth = 40;
        cardHeight = Math.floor(cardWidth * (4/3));
      }

      // aplicar variables CSS
      document.documentElement.style.setProperty('--card-width', cardWidth + 'px');
      document.documentElement.style.setProperty('--card-height', cardHeight + 'px');

      // ajustar ancho del grid y del banner (si existe) para que sean exactamente iguales
      var computedGridWidth = ((cardWidth * columns) + (gap * (columns - 1)));
      if (grid) {
        grid.style.width = computedGridWidth + 'px';
        // actualizar grid-template-columns según columnas
        grid.style.gridTemplateColumns = 'repeat(' + columns + ', ' + cardWidth + 'px)';
      }
      if (giulia) {
        giulia.style.width = computedGridWidth + 'px';
      }

      // IMPORTANT: asegurar que el contenido quede debajo del header -> aplicar padding-top al contenedor
      if (container) {
        // ponemos el padding-top igual a la altura del header + 3px gap
        container.style.paddingTop = (headerH + 3) + 'px';
        container.style.maxWidth = Math.min(1200, vw - 40) + 'px';
      }

      // asegurar que la banner no quede ocultada por el header (margen pequeño local)
      if (giulia) {
        giulia.style.marginTop = '4px';
      }

      // intentar evitar scroll vertical si cabe
      var neededHeight = headerH + footerH + extraVertical + (cardHeight * totalRows);
      if (neededHeight <= vh + 1) {
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
      } else {
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }
    }

    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', function() {
      setTimeout(applyLayout, 220);
    });

    document.addEventListener('DOMContentLoaded', function () {
      // run after small delay and after images load to get correct sizes
      setTimeout(applyLayout, 80);

      var imgs = document.querySelectorAll('img');
      var pending = imgs.length;
      if (pending === 0) applyLayout();
      imgs.forEach(function(img){
        if (img.complete) {
          pending--;
          if (pending === 0) setTimeout(applyLayout, 40);
          return;
        }
        img.addEventListener('load', function(){ pending--; if (pending === 0) setTimeout(applyLayout, 40); });
        img.addEventListener('error', function(){ pending--; if (pending === 0) setTimeout(applyLayout, 40); });
      });
    });
  })();
  </script>
