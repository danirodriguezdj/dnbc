<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNBC AGENCY ROSTER</title>

<style>
@font-face{
  font-family:'horizon';
  src:url('/fonts/horizon.woff2') format('woff2');
  font-display:swap;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#000;
  color:#fff;
  font-family:'horizon',sans-serif;
  text-align:center;
  overflow:hidden;
  min-height:100vh;
}

.menu-toggle{
  position:fixed;
  top:20px;
  left:20px;
  background:none;
  border:none;
  cursor:pointer;
  z-index:1001;
}

.menu-toggle .bar{
  display:block;
  width:30px;
  height:3px;
  background:#fff;
  margin:6px 0;
}

/* El estilo de la sidebar se mantiene igual */
.sidebar{
  position:fixed;
  top:0;
  left:-250px;
  width:250px;
  height:100%;
  background:#111;
  padding-top:60px;
  transition:left .3s;
  z-index:1000;
}

.sidebar.open{left:0;}

.sidebar a{
  display:block;
  color:#fff;
  padding:20px;
  text-transform:uppercase;
  text-decoration:none;
  border-bottom:1px solid #222;
}

.sidebar a:hover{background:#222;}

/* HEADER CORREGIDO */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:75px;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:0 20px;
  z-index:999;
  border-bottom: 2px solid #000;
}

header a {
  display: flex;
  align-items: center;
  height: 100%;
}

header .logo{
  max-width:400px;
  width:80vw;
  height:auto;
  display: block;
}

@media(max-width:700px){
  header{
    justify-content:space-between;
    height:65px;
    padding:0 20px;
  }
  header a {
    margin-left: auto;
  }
  header .logo{
    max-width:250px;
    width:60vw;
    margin-left: 0;
  }
}

main.container{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding-top:85px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h2.section-title{
  margin:4px 0 8px;
  font-size:1.6rem;
  letter-spacing:2px;
}

@media(max-width:700px){
  h2.section-title{
    margin-top:0;
    margin-bottom:8px;
  }
}

:root{
  --artist-gap:8px;
  --grid-columns:5;
  --grid-rows:2;
  --footer-space:70px;
}

main.artist-grid{
  display:grid;
  grid-template-columns:repeat(var(--grid-columns),1fr);
  grid-template-rows:repeat(var(--grid-rows),auto);
  gap:var(--artist-gap);
  width:100%;
  max-width:1400px;
  padding-bottom:var(--footer-space);
}

.artist{
  position:relative;
  overflow:hidden;
  cursor:pointer;
  text-decoration:none;
  color:#fff;
  aspect-ratio:4/5;
}

.artist img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
}

.artist img.playing{
  position:absolute;
  top:0;
  left:0;
  opacity:0;
}

.artist:hover img.base{
  opacity:0;
  transform:scale(1.05);
}

.artist:hover img.playing{
  opacity:1;
  transform:scale(1.05);
}

.artist-info{
  position:absolute;
  bottom:10px;
  width:100%;
  background:rgba(0,0,0,.7);
  padding:6px;
  font-size:.85rem;
  opacity:0;
  transition:.2s;
  color:#fff;
}

.artist:hover .artist-info{
  opacity:1;
}

.footer-link-dock{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:rgba(20,20,20,.75);
  border-radius:21px;
  padding:7px 21px;
  border:1px solid #333;
  font-size:.75rem;
  z-index:2000;
}

.footer-link-dock a{
  color:#fff;
  text-decoration:none;
}

.footer-link-dock a:hover{
  color:#e1306c;
}

@media(max-width:700px){
  main.artist-grid{
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:auto;
    padding-bottom:70px;
  }
}
</style>
</head>

<script>
// Nuevo Script que carga el menú externo e inicializa el toggle
(function() {
  'use strict';
  document.addEventListener('DOMContentLoaded', function() {
    fetch('/menu.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-container').innerHTML = html;
        var btn = document.querySelector('.menu-toggle');
        // Importante: El ID 'sidebar' debe estar dentro de tu menu.html
        var nav = document.getElementById('sidebar'); 
        btn.addEventListener('click', function() {
          nav.classList.toggle('open');
        });
      });
  });
})();

// Tu lógica de grid adaptativo se mantiene igual
function adaptiveGrid(){
  const grid=document.getElementById("artist-grid")
  const artists=grid.querySelectorAll(".artist").length
  const vw=window.innerWidth
  let columns,rows
  if(vw<=700){
    columns=3
    rows=Math.ceil(artists/columns)
  }else{
    rows=2
    columns=Math.ceil(artists/rows)
  }
  document.documentElement.style.setProperty('--grid-columns',columns)
  document.documentElement.style.setProperty('--grid-rows',rows)
}
window.addEventListener("resize",adaptiveGrid)
window.addEventListener("DOMContentLoaded",adaptiveGrid)
</script>
