<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Archivo: agency1/index.html
    Propósito: Página principal de DNBC Agency con listado de artistas.

  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>DNBC Agency</title>
  <meta name="description" content="DIE NACHT BRENNT AGENCY – Underground electronic music artist roster." />
  <meta name="author" content="DNBC Team" />

  <!-- Íconos y manifest para PWA -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DNBC" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Gap entre tarjetas (ligeramente reducido para que crezcan un poco) */
      --artist-gap: 6px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      text-align: center;
      padding: 0 8px 50px 8px;
      overflow-x: hidden;
    }

    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: #111;
      padding-top: 60px;
      transition: left .3s ease;
      z-index: 1000;
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .sidebar a {
      display: block;
      color: #fff;
      padding: 20px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid #222;
    }
    .sidebar a:hover {
      background: #222;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a {
      display: flex;
      align-items: center;
      height: 100%;
    }
    header .logo {
      max-width: 400px;
      width: 80vw;
      height: auto;
      display: block;
    }

    section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      margin-bottom: 10px;
    }

    h2 {
      margin: 26px 0 12px 0;
      text-align: center;
      font-size: 2.1rem;
      font-family: 'horizon', sans-serif;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* Banner Giulia Nigro */
    .artist.manager-banner {
      min-height: 220px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      display: block;
      cursor: pointer;
      background: #181818;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.18);
      /* Justo debajo del header fijo: header(75px) + pequeño gap */
      margin: 78px auto 4px auto;
      max-width: 900px;
    }
    .artist.manager-banner img.base,
    .artist.manager-banner img.playing {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
    }
    .artist.manager-banner img.playing {
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      z-index: 2;
    }
    .artist.manager-banner:hover img.base {
      opacity: 0;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .artist.manager-banner:hover img.playing {
      opacity: 1;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .artist.manager-banner .artist-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      /* 14px -> 12px (otro -15% aprox) para banda más fina */
      padding: 12px 10px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: 1rem;
      font-family: 'horizon', sans-serif;
      opacity: 0;
      transition: opacity .3s;
      z-index: 3;
      letter-spacing: 1px;
      text-align: center;
    }
    .artist.manager-banner:hover .artist-info {
      opacity: 1;
    }

    .manager-name-title {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
    }
    .manager-name-title span {
      display: block;
      width: 100%;
      text-align: center;
      font-family: 'horizon', sans-serif;
      color: #fff;
      text-shadow: 0 2px 14px #000, 0 0 6px #222;
      font-size: 1rem !important;
      font-weight: normal;
      letter-spacing: 2px;
      margin: 30px 0 0 0;
      line-height: 1.1;
      user-select: none;
      transition: font-size .13s linear, transform .13s linear, margin .13s linear;
    }
    .artist.manager-banner:hover .manager-name-title span {
      transform: scale(1.22);
      transition: transform .13s linear;
    }

    .artist {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 7px;
    }
    .artist img.base {
      width: 100%;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
      z-index: 1;
      border-radius: 7px;
    }
    .artist img.playing {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      opacity: 0;
      transition: opacity .3s, transform .3s, filter .3s;
      z-index: 2;
      border-radius: 7px;
    }
    .artist:hover img.base {
      opacity: 0;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .artist:hover img.playing {
      opacity: 1;
      filter: brightness(.5);
      transform: scale(1.05);
    }

    .artist-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,.7);
      opacity: 0;
      transition: opacity .3s;
      color: #fff;
      z-index: 3;
      font-size: 1rem;
      border-radius: 0 0 7px 7px;
      text-align: center;
      white-space: normal;
    }
    .artist:hover .artist-info {
      opacity: 1;
    }

    /* ARTIST GRID */
    main.artist-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: var(--artist-gap) !important;
      max-width: 900px;
      margin: 0 auto;
      padding: 0;
      min-width: 300px;
      overflow-x: auto;
      overflow-y: visible;
    }

    /* Segunda fila con solo 2 artistas */
    main.artist-grid.two-cols {
      grid-template-columns: repeat(2, 1fr) !important;
      max-width: 600px;
    }

    /* Ajustes de espaciados específicos entre secciones */
    /* 1) Entre GIULIA y WORLDWIDE: ~25% del espacio original */
    section:first-of-type { margin-bottom: 4px; }
    section:nth-of-type(2) h2 { margin-top: 6.5px; }

    /* 2) Espacio superior de SPAIN AND PORTUGAL a la mitad */
    section:nth-of-type(2) { margin-bottom: 5px; }
    section:nth-of-type(3) h2 { margin-top: 13px; }

    @media (max-width: 768px) {
      body {
        padding: 0 10px 50px 10px;
      }
      header {
        justify-content: space-between;
        padding: 0 20px;
        height: 65px;
      }
      header a {
        margin-left: auto;
      }
      header .logo {
        max-width: 250px;
        width: 60vw;
      }
      /* Ajuste de margen superior del banner en móvil: header(65px) + pequeño gap */
      .artist.manager-banner {
        margin-top: 68px;
      }
    }

    @media (max-width: 950px) {
      .artist.manager-banner {
        height: 140px;
        min-height: 140px;
        border-radius: 8px;
      }
      .artist.manager-banner img.base,
      .artist.manager-banner img.playing {
        height: 140px;
      }
      .manager-name-title span {
        font-size: 1rem !important;
        margin-top: 8px;
      }
      main.artist-grid,
      main.artist-grid.two-cols {
        max-width: 99vw;
      }
    }

    @media (max-width: 700px) {
      :root { --artist-gap: 5px; } /* menos espacio en móvil para tarjetas un poco más grandes */

      .artist.manager-banner {
        max-width: 99vw;
        min-height: 90px;
        height: 90px;
      }
      .artist.manager-banner img.base,
      .artist.manager-banner img.playing {
        height: 90px;
      }
      h2 {
        font-size: 1.1rem !important;
      }

      /* Mantener tamaño de tarjeta en la última fila (2 cols) igual al de 3-col y centrar */
      main.artist-grid.two-cols {
        grid-template-columns: repeat(2, calc((min(900px, 100vw) - (2 * var(--artist-gap))) / 3)) !important;
        justify-content: center;
      }
      main.artist-grid.two-cols .artist {
        width: calc((min(900px, 100vw) - (2 * var(--artist-gap))) / 3);
        justify-self: center;
      }

      /* Mostrar SIEMPRE el texto en móvil, más pequeño y sin dividir palabras (artistas del grid) */
      main.artist-grid .artist .artist-info {
        opacity: 1 !important;
        background: rgba(0,0,0,0.6);
        font-size: clamp(0.60rem, 2.4vw, 0.80rem);
        line-height: 1.15;
        padding: 7px 8px;
        white-space: normal;    /* permite saltos solo entre palabras */
        word-break: normal;     /* no partir palabras */
        overflow-wrap: normal;  /* no forzar cortes dentro de palabras */
        hyphens: none;          /* sin guiones automáticos */
        text-overflow: clip;
      }
      main.artist-grid .artist:hover .artist-info {
        opacity: 1 !important;
      }

      /* Mostrar SIEMPRE el texto del banner de la manager en móvil, mismo tamaño y AÚN más fino (-15% adicional) */
      .artist.manager-banner .artist-info {
        opacity: 1 !important;
        background: rgba(0,0,0,0.6);
        font-size: clamp(0.60rem, 2.4vw, 0.80rem);
        line-height: 1.15;
        /* 6px -> 5px (otro -15% aprox) */
        padding: 5px 8px;
        white-space: normal;
        word-break: normal;
        overflow-wrap: normal;
        hyphens: none;
        text-overflow: clip;
      }
      .artist.manager-banner:hover .artist-info {
        opacity: 1 !important;
      }
    }

    @media (max-width: 500px) {
      .footer-link-dock {
        font-size: 0.67rem;        /* reducido a ~2/3 del original en móvil */
        padding: 5px 11px;         /* reducido a ~2/3 */
        bottom: 12px;
      }
    }

    /* Footer dock (reducido a 2/3 del tamaño original) */
    .footer-link-dock {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(20, 20, 20, 0.75);
      border-radius: 21px;         /* 32px -> ~21px */
      padding: 7px 21px;           /* 10px 32px -> ~2/3 */
      box-shadow: 0 6px 24px 4px rgba(0,0,0,0.35);
      border: 1.5px solid #333;
      backdrop-filter: blur(2px);
      font-family: 'horizon', sans-serif;
      font-size: 0.75rem;          /* 1.12rem -> ~0.75rem */
      letter-spacing: 1px;
      transition: background 0.2s;
      z-index: 2000;
    }
    .footer-link-dock a {
      color: #fff;
      text-decoration: none;
      font-family: 'horizon', sans-serif;
      font-size: 0.77rem;          /* 1.15rem -> ~0.77rem */
      transition: color 0.2s, filter 0.2s;
      display: flex;
      align-items: center;
    }
    .footer-link-dock a:hover {
      color: #e1306c;
      filter: drop-shadow(0 0 6px #e1306c70);
    }
  </style>
</head>
<body>
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <div id="menu-container"></div>

  <header>
    <a href="https://dienachtbrenntclub.com" rel="noopener">

  <!-- Banner Giulia Nigro separado -->
  <section>

  <section>

      <a class="artist" href="https://dienachtbrenntclub.com/danirodriguez">

      <a class="artist" href="https://dienachtbrenntclub.com/laveranotte">
        <img class="base"    src="img/laveranotte.jpg"      alt="La Vera Notte" />
        <img class="playing" src="img/laveranotteplaying.jpg" alt="La Vera Notte pinchando" />
        <div class="artist-info">Dance Authority</div>
      </a>
    </main>
  </section>

  <!-- Sección SPAIN AND PORTUGAL -->
  <section>
    <h2>SPAIN & PORTUGAL</h2>
    <main class="artist-grid">
      <a class="artist" href="https://dienachtbrenntclub.com/mikes">
        <img class="base"    src="img/mikes.jpg"            alt="Mikes" />
        <img class="playing" src="img/mikesplaying.jpg"     alt="Mikes pinchando" />
        <div class="artist-info">Oldschool Rage</div>
      </a>
      <a class="artist" href="https://dienachtbrenntclub.com/vitalgroove">
        <img class="base"    src="img/vitalgroove.jpg"       alt="Vital Groove" />
        <img class="playing" src="img/vitalgrooveplaying.jpg" alt="Vital Groove pinchando" />
        <div class="artist-info">Groove Commander</div>
      </a>
      <a class="artist" href="https://dienachtbrenntclub.com/kb45">
        <img class="base"    src="img/kb45.jpg"            alt="KB45" />
        <img class="playing" src="img/kb45playing.jpg"     alt="KB45 pinchando" />
        <div class="artist-info">Trance Driver</div>
      </a>
    </main>
    <main class="artist-grid two-cols" style="margin-top:8px;">
      <a class="artist" href="https://dienachtbrenntclub.com/filo">
        <img class="base"    src="img/filo.jpg"            alt="FILØ" />
        <img class="playing" src="img/filoplaying.jpg"     alt="FILØ pinchando" />
        <div class="artist-info">Power Surgeon</div>
      </a>
      <a class="artist" href="https://dienachtbrenntclub.com/deathwrap">
        <img class="base"    src="img/deathwrap.jpg"       alt="DEATHWRAP" />
        <img class="playing" src="img/deathwrapplaying.jpg" alt="DEATHWRAP pinchando" />
        <div class="artist-info">Bounce Fury</div>
      </a>
    </main>
  </section>

  <div class="footer-link-dock">
    <a href="https://instagram.com/dnbcagency" target="_blank" rel="noopener">@dnbcagency</a>
  </div>

  <script>
  (function() {
    'use strict';
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Carga el menú desde menu.html
      fetch('/menu.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('menu-container').innerHTML = html;
          // 2. Después de insertar el menú, añade el evento al botón hamburguesa
          var btn = document.querySelector('.menu-toggle');
          var nav = document.getElementById('sidebar');
          btn.addEventListener('click', function() {
            nav.classList.toggle('open');
          });
        });
    });
  })();
  </script>
</body>
</html>
