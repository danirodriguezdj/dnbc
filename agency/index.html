<!DOCTYPE html>
<html lang="en"><head>
  <!--
    Archivo: agency1/index.html
    Propósito: Página principal de DNBC Agency (ajuste: evitar que el banner de Giulia quede parcialmente oculto en móvil).
    Estándar de documentación: ISO/IEC/IEEE 26515
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000">
  <title>DIE NACHT BRENNT CLUB</title>
  <meta name="description" content="DNBC — Die Nacht Brennt Club. Official page. Underground electronic music, DJ podcasts, and events.">
  <meta name="keywords" content="DNBC, Die Nacht Brennt Club, techno, electronic music, DJ sets, underground club, spain, clubbing, dnbc">
  <meta name="author" content="DNBC Team">

  <!-- Íconos y manifest para PWA -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DNBC">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* RESTAURADO: body padding original de la versión agency (sin el espaciado grande que venía en main) */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      text-align: center;
      padding: 0 8px 50px 8px; /* <-- restaurado */
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Botón hamburguesa (COPIADO EXACTO) */
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }

    /* Sidebar (COPIADO EXACTO) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: #111;
      padding-top: 60px;
      transition: left .3s ease;
      z-index: 1000;
    }
    .sidebar.open { left: 0; }
    .sidebar ul { list-style: none; }
    .sidebar a {
      display: block;
      color: #fff;
      padding: 20px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid #222;
    }
    .sidebar a:hover { background: #222; }

    /* Header fijo con logo centrado (COPIADO EXACTO) */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a { display: flex; align-items: center; height: 100%; }
    header .logo {
      max-width: 400px;
      width: 80vw;
      height: auto;
    }

    @media (max-width: 768px) {
      /* padding reducido en móvil; el JS coloca el padding-top exacto en main.container */
      body { padding: 0 10px 50px; }
      header { justify-content: space-between; padding: 0 20px; height: 65px; }
      header a { margin-left: auto; }
      header .logo { max-width: 250px; width: 60vw; }
    }
  </style>

  <style>
    :root {
      --artist-gap: 6px;
      --card-width: 180px;
      --card-height: 240px;
      --page-padding-x: 8px;
    }

    main.container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 0; /* JS actualizará esto en runtime para que el contenido quede debajo del header */
      z-index: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main.artist-grid {
      display: grid;
      grid-template-columns: repeat(4, var(--card-width));
      gap: var(--artist-gap);
      width: calc((var(--card-width) * 4) + (var(--artist-gap) * 3));
      max-width: calc(100% - (var(--page-padding-x) * 2));
      justify-content: center;
      margin: 8px 0 28px 0;
    }

    @media (max-width: 700px) {
      main.artist-grid {
        grid-template-columns: repeat(3, var(--card-width));
        width: calc((var(--card-width) * 3) + (var(--artist-gap) * 2));
      }

    </style>



</head>
<body>
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  <main class="container" id="main-container">
<!-- content removed as per giulia keyword referenced request auto excluded -->
  </main>
 </body></html>
