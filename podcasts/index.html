<!DOCTYPE html>
<html lang="en">
<head>

    Archivo: podcasts/index.html
    Propósito: Página de podcasts de DNBC con listado de episodios

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>Podcasts — DIE NACHT BRENNT CLUB</title>
  <meta name="description" content="DNBC Podcasts — Underground electronic music DJ sets and podcasts from Die Nacht Brennt Club." />
  <meta name="keywords" content="DNBC, Die Nacht Brennt Club, techno, electronic music, DJ sets, podcasts, underground club, spain, clubbing" />
  <meta name="author" content="DNBC Team" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      padding-top: 75px;
      line-height: 1.4;
    }
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: #111;
      padding-top: 60px;
      transition: left .3s ease;
      z-index: 1000;
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar ul {
      list-style: none;
    }
    .sidebar a {
      display: block;
      color: #fff;
      padding: 20px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid #222;
    }
    .sidebar a:hover {
      background: #222;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a {
      display: flex;
      align-items: center;
      height: 100%;
      margin-left: auto;
    }
    header .logo {
      max-width: 400px;
      width: 80vw;
      height: auto;
    }
    
    /* Main content styles */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .page-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .page-subtitle {
      text-align: center;
      font-size: 1rem;
      color: #888;
      margin-bottom: 40px;
    }
    
    .submit-link {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .submit-link a {
      color: #ff0033;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      border: 2px solid #ff0033;
      padding: 10px 20px;
      display: inline-block;
      transition: all 0.3s ease;
    }
    
    .submit-link a:hover {
      background: #ff0033;
      color: #fff;
    }
    
    .loading {
      text-align: center;
      color: #888;
      font-size: 1.1rem;
      margin: 60px 0;
    }
    
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }
    
    .episode-card {
      background: #111;
      border: 1px solid #333;
      padding: 25px;
      transition: all 0.3s ease;
    }
    
    .episode-card:hover {
      border-color: #ff0033;
      transform: translateY(-2px);
    }
    
    .episode-title {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .episode-artist {
      font-size: 1rem;
      color: #ff0033;
      margin-bottom: 12px;
      font-weight: bold;
    }
    
    .episode-meta {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #888;
    }
    
    .episode-description {
      color: #ccc;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .episode-player {
      margin-bottom: 15px;
    }
    
    .episode-player iframe {
      width: 100%;
      height: 120px;
      border: none;
    }
    
    .episode-links {
      display: flex;
      gap: 10px;
    }
    
    .episode-link {
      color: #fff;
      text-decoration: none;
      padding: 8px 15px;
      background: #222;
      border: 1px solid #444;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    
    .episode-link:hover {
      background: #ff0033;
      border-color: #ff0033;
    }
    
    .error-message {
      text-align: center;
      color: #ff0033;
      font-size: 1.1rem;
      margin: 60px 0;
    }
    
    @media (max-width: 768px) {
      body {
        padding-top: 65px;
      }
      header {
        height: 65px;
        padding: 0 20px;
      }
      header .logo {
        max-width: 250px;
        width: 60vw;
      }
      main {
        padding: 20px 15px;
      }
      .page-title {
        font-size: 2rem;
      }
      .episodes-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .episode-card {
        padding: 20px;
      }
      .episode-meta {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>

</head>
<body>
  <!-- Botón hamburguesa -->
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <!-- Contenedor del menú -->
  <div id="menu-container"></div>

  <!-- Header -->
  <header>
    <a href="https://dienachtbrenntclub.com" rel="noopener">
      <img src="/logoletraslargo.png" alt="DNBC logo" class="logo" />
    </a>
  </header>

  <!-- Main content -->
  <main>
    <h1 class="page-title">Podcasts</h1>
    <p class="page-subtitle">Underground electronic music DJ sets from DNBC</p>
    
    <div class="submit-link">
      <a href="/podcasts/submit/">Submit Your Podcast</a>
    </div>

    <div id="loading" class="loading">Loading episodes...</div>
    <div id="error-message" class="error-message" style="display: none;"></div>
    <div id="episodes-container" class="episodes-grid"></div>
  </main>

  <!-- Scripts -->
  <script>
    (function() {
      'use strict';
      
      // Load menu and setup hamburger functionality
      document.addEventListener('DOMContentLoaded', function() {
        fetch('/menu.html')
          .then(res => res.text())
          .then(html => {
            document.getElementById('menu-container').innerHTML = html;
            var btn = document.querySelector('.menu-toggle');
            var nav = document.getElementById('sidebar');
            btn.addEventListener('click', function() {
              nav.classList.toggle('open');
            });
          })
          .catch(err => console.warn('Could not load menu:', err));
          
        // Load and display podcast episodes
        loadEpisodes();
      });
      
      function loadEpisodes() {
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error-message');
        const containerEl = document.getElementById('episodes-container');
        
        fetch('/podcasts/episodes.json')
          .then(response => {
            if (!response.ok) {
              throw new Error('Failed to load episodes');
            }
            return response.json();
          })
          .then(episodes => {
            loadingEl.style.display = 'none';
            renderEpisodes(episodes, containerEl);
          })
          .catch(error => {
            console.error('Error loading episodes:', error);
            loadingEl.style.display = 'none';
            errorEl.textContent = 'Failed to load podcast episodes. Please try again later.';
            errorEl.style.display = 'block';
          });
      }
      
      function renderEpisodes(episodes, container) {
        if (!episodes || episodes.length === 0) {
          container.innerHTML = '<div class="error-message">No episodes available yet.</div>';
          return;
        }
        
        // Sort episodes by publish date (newest first)
        episodes.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
        
        container.innerHTML = episodes.map(episode => createEpisodeCard(episode)).join('');
      }
      
      function createEpisodeCard(episode) {
        const publishDate = new Date(episode.publishDate).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        
        return `
          <article class="episode-card">
            <h2 class="episode-title">${escapeHtml(episode.title)}</h2>
            <div class="episode-artist">${escapeHtml(episode.artist)}</div>
            <div class="episode-meta">
              <span>📅 ${publishDate}</span>
              <span>⏱️ ${escapeHtml(episode.duration)}</span>
              <span>🎵 ${escapeHtml(episode.genre)}</span>
            </div>
            <div class="episode-description">${escapeHtml(episode.description)}</div>
            ${episode.embedUrl ? `
              <div class="episode-player">
                <iframe src="${escapeHtml(episode.embedUrl)}" loading="lazy"></iframe>
              </div>
            ` : ''}
            <div class="episode-links">
              ${episode.soundcloudUrl ? `
                <a href="${escapeHtml(episode.soundcloudUrl)}" class="episode-link" target="_blank" rel="noopener">
                  🎧 SoundCloud
                </a>
              ` : ''}
            </div>
          </article>
        `;
      }
      
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
