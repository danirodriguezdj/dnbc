<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DNBC Podcasts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { background: #0b0806; color: white; font-family: sans-serif; margin: 0; }
  .container { max-width: 1000px; margin: auto; padding: 2rem; }
  h1 { text-align: center; margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 1.5rem; }
  .card { background: #1a1816; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; display: block; }
  .info { padding: 1rem; }
  .info h3 { margin: 0 0 .5rem; font-size: 1.1rem; }
  .info p { margin: 0 0 1rem; color: #aaa; font-size: .9rem; }
  .embed { margin: 0 1rem 1rem; }
  .embed iframe { width: 100%; height: 80px; background: #000; border: none; }
  .controls { margin: 0 1rem 1rem; }
  .controls button { background: white; color: black; border: none; width: 100%; padding: .7rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
  .controls button:hover { background: #ccc; }
</style>
</head>
<body>
  <div class="container">
    <h1>DNBC Podcasts</h1>
    <div id="podcast-grid" class="grid"></div>
  </div>
  <script>
    const podcasts = [
      {
        title: "#032 – Dres Codex",
        artist: "Dres Codex",
        cover: "https://i1.sndcdn.com/artworks-abcdefg-original.jpg",
        sc_url: "https://soundcloud.com/dienachtbrenntclub/032-dres-codex-die-nacht-brennt-podcast",
        embed: "https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/dienachtbrenntclub/032-dres-codex-die-nacht-brennt-podcast&color=%23000000&inverse=true&show_user=false&show_teaser=false"
      },
      {
        title: "#031 – Nico Bondi",
        artist: "Nico Bondi",
        cover: "https://i1.sndcdn.com/artworks-hijklmn-original.jpg",
        sc_url: "https://soundcloud.com/dienachtbrenntclub/031-nico-bondi-die-nacht-brennt-podcast",
        embed: "https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/dienachtbrenntclub/031-nico-bondi-die-nacht-brennt-podcast&color=%23000000&inverse=true&show_user=false&show_teaser=false"
      }
      // ... añade los otros 30 de forma similar
    ];
    const container = document.getElementById("podcast-grid");
    podcasts.forEach(ep => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${ep.cover}" alt="${ep.title}">
        <div class="info">
          <h3>${ep.title}</h3>
          <p>${ep.artist}</p>
        </div>
        <div class="embed"><iframe allow="autoplay" src="${ep.embed}"></iframe></div>
        <div class="controls">
          <button onclick="window.open('${ep.sc_url}','_blank')">Abrir en SoundCloud</button>
        </div>`;
      container.appendChild(card);
    });
  </script>
</body>
</html>
