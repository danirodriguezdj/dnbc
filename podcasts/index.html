<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Your Podcast – DNBC</title>
  <meta name="description" content="Submit your podcast to DNBC." />
  <meta name="theme-color" content="#000" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DNBC" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      font-size: 14px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 999;
      border-bottom: 1px solid #111;
    }

    header .logo {
      max-height: 40px;
      width: auto;
    }

    .menu-toggle {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 40px;
      padding: 0;
      z-index: 1001;
    }

    .menu-toggle .bar {
      width: 20px;
      height: 2px;
      background: #fff;
      margin: 3px 0;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -200px;
      width: 200px;
      height: 100%;
      background: #111;
      padding-top: 50px;
      transition: left .3s ease;
      z-index: 1000;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar a {
      display: block;
      color: #fff;
      padding: 12px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid #222;
      text-align: center;
      font-size: 13px;
    }

    .sidebar a:hover {
      background: #222;
    }

    main {
      flex: 1;
      padding-top: 60px;
      width: 100vw;
      max-width: 400px;
      padding-left: 10px;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, button {
      padding: 8px;
      font-size: 0.85rem;
      border: none;
      border-radius: 0;
      font-family: 'horizon', sans-serif;
    }

    input {
      background: #111;
      color: #fff;
      border: 1px solid #333;
    }

    input::placeholder {
      color: #888;
    }

    button {
      background: #ff0033;
      color: #fff;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    button:hover {
      background: #ff3355;
    }

    @media (max-width: 768px) {
      .sidebar a {
        font-size: 12px;
      }

      header .logo {
        max-width: 180px;
        height: auto;
      }

      h1 {
        font-size: 1rem;
      }

      p {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <button class="menu-toggle" aria-label="Toggle menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <a href="https://dienachtbrenntclub.com" rel="noopener">
      <img src="/logoletraslargo.png" alt="DNBC Agency logo" class="logo" />
    </a>
  </header>

  <div class="sidebar" id="sidebar">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/agency1">Agency</a></li>
      <li><a href="/club-history">Club History</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/submit">Submit Podcast</a></li>
    </ul>
  </div>

  <main>
    <h1>Submit Your Podcast</h1>
    <p>Send us your private SoundCloud set. Include genre, artist name, and contact info.</p>
    <form action="https://formspree.io/f/xovllnbb" method="POST">
      <input type="text" name="artist_name" placeholder="Artist Name" required>
      <input type="text" name="genre" placeholder="Genre of the set" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="text" name="instagram" placeholder="Instagram handle (@...)" required>
      <input type="url" name="soundcloud_link" placeholder="Private SoundCloud link" required>
      <button type="submit">Send Podcast</button>
    </form>
  </main>

  <script>
    (function() {
      'use strict';
      document.addEventListener('DOMContentLoaded', function() {
        const btn = document.querySelector('.menu-toggle');
        const sidebar = document.getElementById('sidebar');
        btn.addEventListener('click', function() {
          sidebar.classList.toggle('open');
        });
      });
    })();
  </script>
</body>
</html>
