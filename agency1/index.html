<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>DNBC Agency</title>
  <meta name="description" content="DIE NACHT BRENNT AGENCY – Underground electronic music artist roster." />
  <meta name="author" content="DNBC Team" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DNBC" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      text-align: center;
      padding: 0 20px 50px 20px;
      overflow-x: hidden;
    }
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: #111;
      padding-top: 60px;
      transition: left .3s ease;
      z-index: 1000;
    }
    .sidebar.open { left: 0; }
    .sidebar ul { list-style: none; }
    .sidebar a {
      display: block;
      color: #fff;
      padding: 20px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid #222;
    }
    .sidebar a:hover { background: #222; }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-bottom: 2px solid #000;
    }
    header a { display: flex; align-items: center; height: 100%; }
    header .logo { max-width: 400px; width: 80vw; height: auto; }

    /* MANAGER EXACTAMENTE COMO TU EJEMPLO */
    .artist.manager-banner {
      grid-column: 1 / -1;
      min-height: 220px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      display: block;
      cursor: pointer;
      background: #181818;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.18);
    }
    .artist.manager-banner img.base,
    .artist.manager-banner img.playing {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
    }
    .artist.manager-banner img.playing {
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      z-index: 2;
    }
    .artist.manager-banner:hover img.base {
      opacity: 0;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .artist.manager-banner:hover img.playing {
      opacity: 1;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .artist.manager-banner .artist-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 16px 10px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: 1rem;
      font-family: 'horizon', sans-serif;
      opacity: 0;
      transition: opacity .3s;
      z-index: 3;
      letter-spacing: 1px;
      text-align: center;
    }
    .artist.manager-banner:hover .artist-info { opacity: 1; }
    .manager-name-title {
      position: absolute;
      top: 0; left: 0; width: 100%; z-index: 4;
      display: flex; align-items: flex-start; justify-content: center; pointer-events: none;
    }
    .manager-name-title span {
      display: block; width: 100%; text-align: center; font-family: 'horizon', sans-serif;
      color: #fff; text-shadow: 0 2px 14px #000, 0 0 6px #222;
      font-size: 1rem !important; font-weight: normal; letter-spacing: 2px;
      margin: 30px 0 0 0; line-height: 1.1; user-select: none;
      transition: font-size .13s linear, transform .13s linear, margin .13s linear;
    }
    .artist.manager-banner:hover .manager-name-title span { transform: scale(1.22); }

    /* ARTISTAS: grid SIEMPRE de 3 columnas, gap mínimo en móvil */
    .artists-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .artists-row.centered {
      justify-content: center;
    }
    .artists-row.centered > .empty {
      visibility: hidden;
      pointer-events: none;
    }
    .artist {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #181818;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.10);
      border-radius: 0;
    }
    .artist img.base {
      width: 100%;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
      z-index: 1;
    }
    .artist img.playing {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      opacity: 0;
      transition: opacity .3s, transform .3s, filter .3s;
      z-index: 2;
    }
    .artist:hover img.base {
      opacity: 0; filter: brightness(.5); transform: scale(1.05);
    }
    .artist:hover img.playing {
      opacity: 1; filter: brightness(.5); transform: scale(1.05);
    }
    .artist-info {
      position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px;
      background: rgba(0,0,0,.7); opacity: 0; transition: opacity .3s;
      color: #fff; z-index: 3; font-size: 1rem;
    }
    .artist:hover .artist-info { opacity: 1; }

    .footer-link { display: none; }
    .footer-link-dock {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center;
      background: rgba(20, 20, 20, 0.75); border-radius: 32px; padding: 10px 32px;
      box-shadow: 0 6px 24px 4px rgba(0,0,0,0.35); border: 1.5px solid #333;
      backdrop-filter: blur(2px); font-family: 'horizon', sans-serif; font-size: 1.12rem;
      letter-spacing: 1px; transition: background 0.2s; z-index: 2000;
    }
    .footer-link-dock a {
      color: #fff; text-decoration: none; font-family: 'horizon', sans-serif; font-size: 1.15rem;
      transition: color 0.2s, filter 0.2s; display: flex; align-items: center;
    }
    .footer-link-dock a:hover {
      color: #e1306c; filter: drop-shadow(0 0 6px #e1306c70);
    }
    @media (max-width: 900px) {
      .artists-row, .artists-row.centered { gap: 4px; }
      .artist.manager-banner,
      .artist.manager-banner img.base,
      .artist.manager-banner img.playing {
        height: 140px; min-height: 140px; border-radius: 8px;
      }
      .artist.manager-banner .artist-info { font-size: 1rem; padding: 8px 5px; }
      .manager-name-title span { font-size: 1rem !important; margin-top: 8px; }
    }
    @media (max-width: 600px) {
      .artists-row, .artists-row.centered { gap: 2px; max-width: 98vw; }
      .artist.manager-banner,
      .artist.manager-banner img.base,
      .artist.manager-banner img.playing {
        height: 90px; min-height: 90px; border-radius: 7px;
      }
      .artist.manager-banner .artist-info { font-size: 13px; padding: 6px 2px; }
      .manager-name-title span { font-size: 13px !important; margin-top: 2px; }
      .artist-info { font-size: 13px; }
    }
    @media (max-width: 768px) {
      body { padding: 0 10px 50px 10px; }
      header { justify-content: space-between; padding: 0 20px; height: 65px; }
      header a { margin-left: auto; }
      header .logo { max-width: 250px; width: 60vw; }
      .footer-link-dock { font-size: 1rem; padding: 8px 16px; bottom: 12px; }
      .artist-info { opacity: 1 !important; text-decoration: none !important; pointer-events: none; font-size: 13px; line-height: 1.2; }
    }
  </style>
</head>

  <script>
  (function() {
    'use strict';
    document.addEventListener('DOMContentLoaded', function() {
      fetch('/menu.html')
