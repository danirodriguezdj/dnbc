<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Archivo: agency1/index.html
    Propósito: Página principal de DNBC Agency con listado de artistas (ajustada banner Giulia 70% altura tarjeta).
    Estándar de documentación: ISO/IEC/IEEE 26515
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>DNBC Agency</title>
  <meta name="description" content="DIE NACHT BRENNT AGENCY – Underground electronic music artist roster." />
  <meta name="author" content="DNBC Team" />

  <style>
    @font-face {
      font-family: 'horizon';
      src: url('/fonts/horizon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --artist-gap: 6px;
      --card-width: 180px;  /* valores iniciales; serán actualizados por JS */
      --card-height: 240px;
      --page-padding-x: 8px;
      --header-h: 75px;
      --footer-h: 50px;
    }

    html, body {
      height: 100vh;         /* forzar a ocupar viewport */
      overflow: hidden;      /* evitar scroll (nos adaptamos al tamaño con JS) */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: 'horizon', sans-serif;
      text-align: center;
      padding: 0 var(--page-padding-x) 0 var(--page-padding-x);
    }

    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }
    .menu-toggle .bar {
      display: block;
      width: 30px;
      height: 3px;
      background: #fff;
      margin: 6px 0;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: #111;
      padding-top: 60px;
      transition: left .3s ease;
      z-index: 1000;
    }
    .sidebar.open { left: 0; }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-h);
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
    }
    header a { display: flex; align-items: center; height: 100%; }
    header .logo { max-width: 400px; width: 80vw; height: auto; display:block; }

    main.page-wrap {
      margin-top: var(--header-h);
      margin-bottom: var(--footer-h);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    section { width: 100%; display:flex; justify-content:center; align-items:center; }

    h2 {
      margin: 16px 0 8px;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* Banner Giulia: ahora 70% de la altura de una tarjeta de artista */
    .artist.manager-banner {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      display: block;
      cursor: pointer;
      background: #181818;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.18);
      width: calc( (var(--card-width) * 4) + (var(--artist-gap) * 3) ); /* igual que el ancho del grid */
      max-width: calc(100% - (var(--page-padding-x) * 2));
      height: calc(var(--card-height) * 0.70); /* <-- 70% de la tarjeta */
      min-height: 48px; /* protección en pantallas muy pequeñas */
      transition: width .18s ease, height .18s ease;
    }
    .artist.manager-banner img.base,
    .artist.manager-banner img.playing {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
      border-radius: 10px;
    }
    .artist.manager-banner img.playing { position:absolute; top:0;left:0; opacity:0; z-index:2; }
    .artist.manager-banner:hover img.base { opacity:0; filter:brightness(.5); transform:scale(1.05); }
    .artist.manager-banner:hover img.playing { opacity:1; filter:brightness(.5); transform:scale(1.05); }

    .artist.manager-banner .artist-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity .3s;
      z-index: 3;
      text-align: center;
    }
    .artist.manager-banner:hover .artist-info { opacity:1; }

    .manager-name-title { position:absolute; top:0; left:0; width:100%; z-index:4; display:flex; justify-content:center; pointer-events:none; }
    .manager-name-title span { color:#fff; text-shadow:0 2px 14px #000; margin:12px 0 0; letter-spacing:2px; font-size:1rem; }

    /* Artista individual */
    .artist { position: relative; overflow: hidden; cursor: pointer; border-radius: 0; display:block; }
    .artist img.base {
      width: var(--card-width);
      height: var(--card-height);
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
      object-fit: cover;
      border-radius: 0;
    }
    .artist img.playing {
      position: absolute;
      top: 0; left: 0;
      width: var(--card-width);
      height: var(--card-height);
      opacity: 0;
      transition: opacity .3s, transform .3s, filter .3s;
      object-fit: cover;
    }
    .artist:hover img.base { opacity:0; filter:brightness(.5); transform:scale(1.05); }
    .artist:hover img.playing { opacity:1; filter:brightness(.5); transform:scale(1.05); }

    .artist-info {
      position: absolute;
      bottom: 0; left: 0;
      width: var(--card-width);
      padding: 8px;
      background: rgba(0,0,0,.7);
      opacity: 0;
      transition: opacity .2s;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
    }
    .artist:hover .artist-info { opacity: 1; }

    /* GRID unificado: 4 columnas con columnas igual a --card-width */
    main.artist-grid {
      display: grid;
      grid-template-columns: repeat(4, var(--card-width));
      gap: var(--artist-gap);
      width: calc( (var(--card-width) * 4) + (var(--artist-gap) * 3) );
      max-width: calc(100% - (var(--page-padding-x) * 2));
      justify-content: center;
      margin: 8px 0;
    }

    /* Footer dock (se mantiene) */
    .footer-link-dock {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(20, 20, 20, 0.75);
      border-radius: 21px;
      padding: 7px 21px;
      box-shadow: 0 6px 24px 4px rgba(0,0,0,0.35);
      border: 1.5px solid #333;
      backdrop-filter: blur(2px);
      font-family: 'horizon', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      z-index: 2000;
      height: var(--footer-h); /* usada en cálculo JS */
      line-height: var(--footer-h);
    }
    .footer-link-dock a { color: #fff; text-decoration: none; display:flex; align-items:center; }
    .footer-link-dock a:hover { color: #e1306c; filter: drop-shadow(0 0 6px #e1306c70); }

    /* Responsive fallback si JS falla: mantener visual razonable */
    @media (max-width: 700px) {
      :root { --artist-gap: 5px; }
      header { height: 65px; }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" aria-label="Toggle menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <div id="menu-container"></div>

  <header>
    <a href="https://dienachtbrenntclub.com" rel="noopener">
      <img src="/logoletraslargo.png" alt="DNBC Agency logo" class="logo" />
    </a>
  </header>

  <main class="page-wrap" id="page-wrap">
    <!-- Banner Giulia Nigro adaptada al ancho del grid (ahora 70% de la altura de tarjeta) -->
    <section>
      <a class="artist manager-banner" href="https://dienachtbrenntclub.com/giulianigro" id="giulia-banner">
        <div class="manager-name-title">
          <span>GIULIA NIGRO</span>
        </div>
        <img class="base"    src="img/giulianigro.jpg"         alt="Giuliani Gro" />
        <img class="playing" src="img/giulianigroplaying.jpg"  alt="Giuliani Gro en acción" />
        <div class="artist-info">Management Mama</div>
      </a>
    </section>

    <!-- Sección UNIFICADA: todos los artistas en un único grid, mismo orden que antes. -->
    <section style="flex-direction:column; align-items:center;">
      <h2>ARTISTS</h2>
      <main class="artist-grid" id="artist-grid">
        <!-- Orden original: Coke, Dani, La Vera, Darzien, Mikes, Vital Groove, KB45, FILØ -->
        <a class="artist" href="https://dienachtbrenntclub.com/cokecortes">
          <img class="base"    src="img/cokecortes.jpg"        alt="Coke Cortés" />
          <img class="playing" src="img/cokecortesplaying.jpg" alt="Coke Cortés pinchando" />
          <div class="artist-info">Sacred Violence</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/danirodriguez">
          <img class="base"    src="img/danirodriguez.jpg"        alt="Dani Rodriguez" />
          <img class="playing" src="img/danirodriguezplaying.jpg" alt="Dani Rodriguez pinchando" />
          <div class="artist-info">Fast soul</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/laveranotte">
          <img class="base"    src="img/laveranotte.jpg"      alt="La Vera Notte" />
          <img class="playing" src="img/laveranotteplaying.jpg" alt="La Vera Notte pinchando" />
          <div class="artist-info">Dance Authority</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/darzien">
          <img class="base"    src="img/darzien.jpg"        alt="Darzien" />
          <img class="playing" src="img/darzienplaying.jpg" alt="Darzien pinchando" />
          <div class="artist-info">Hidden Riot</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/mikes">
          <img class="base"    src="img/mikes.jpg"            alt="Mikes" />
          <img class="playing" src="img/mikesplaying.jpg"     alt="Mikes pinchando" />
          <div class="artist-info">Oldschool Rage</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/vitalgroove">
          <img class="base"    src="img/vitalgroove.jpg"       alt="Vital Groove" />
          <img class="playing" src="img/vitalgrooveplaying.jpg" alt="Vital Groove pinchando" />
          <div class="artist-info">Groove Commander</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/kb45">
          <img class="base"    src="img/kb45.jpg"            alt="KB45" />
          <img class="playing" src="img/kb45playing.jpg"     alt="KB45 pinchando" />
          <div class="artist-info">Trance Driver</div>
        </a>

        <a class="artist" href="https://dienachtbrenntclub.com/filo">
          <img class="base"    src="img/filo.jpg"            alt="FILØ" />
          <img class="playing" src="img/filoplaying.jpg"     alt="FILØ pinchando" />
          <div class="artist-info">Power Surgeon</div>
        </a>
      </main>
    </section>
  </main>

  <div class="footer-link-dock" id="footer-dock">
    <a href="https://instagram.com/dnbcagency" target="_blank" rel="noopener">@dnbcagency</a>
  </div>

  <script>
    (function () {
      'use strict';

      function applyLayout() {
        var vh = window.innerHeight;
        var vw = window.innerWidth;

        var header = document.querySelector('header');
        var footer = document.getElementById('footer-dock');
        var grid = document.getElementById('artist-grid');

        var headerH = header ? header.offsetHeight : 75;
        var footerH = footer ? footer.offsetHeight : 50;
        var extra = 24; // espacio para títulos / gaps
        var rows = 3; // 1 fila Giulia + 2 filas artistas

        var root = getComputedStyle(document.documentElement);
        var gap = parseInt(root.getPropertyValue('--artist-gap')) || 6;
        var pagePaddingX = parseInt(root.getPropertyValue('--page-padding-x')) || 8;

        var availableHeight = vh - headerH - footerH - extra;
        if (availableHeight < 120) { availableHeight = Math.max(120, vh - headerH - footerH); }

        var maxCardHeightByHeight = Math.floor(availableHeight / rows);

        var totalGapsWidth = gap * 3;
        var availableWidth = vw - (pagePaddingX * 2);
        var maxCardWidthByWidth = Math.floor((availableWidth - totalGapsWidth) / 4);
        if (maxCardWidthByWidth < 40) maxCardWidthByWidth = 40;

        // aspect-ratio 3/4 (width / height = 3/4) => height = width * 4/3
        var heightFromWidth = Math.floor(maxCardWidthByWidth * (4/3));

        var cardHeight = Math.min(maxCardHeightByHeight, heightFromWidth);
        if (cardHeight < 60) cardHeight = 60;

        var cardWidth = Math.floor(cardHeight * (3/4));
        if (cardWidth < 40) cardWidth = 40;

        var totalGridWidth = (cardWidth * 4) + (gap * 3);
        if (totalGridWidth > availableWidth) {
          cardWidth = Math.floor((availableWidth - (gap * 3)) / 4);
          if (cardWidth < 40) cardWidth = 40;
          cardHeight = Math.floor(cardWidth * (4/3));
        }

        document.documentElement.style.setProperty('--card-width', cardWidth + 'px');
        document.documentElement.style.setProperty('--card-height', cardHeight + 'px');
        document.documentElement.style.setProperty('--header-h', headerH + 'px');
        document.documentElement.style.setProperty('--footer-h', footerH + 'px');

        var pageWrap = document.getElementById('page-wrap');
        if (pageWrap) {
          var wrapHeight = vh - headerH - footerH;
          pageWrap.style.height = wrapHeight + 'px';
        }

        if (grid) {
          grid.style.width = ((cardWidth * 4) + (gap * 3)) + 'px';
        }
      }

      window.addEventListener('resize', applyLayout);
      window.addEventListener('orientationchange', function() {
        setTimeout(applyLayout, 280);
      });

      document.addEventListener('DOMContentLoaded', function () {
        fetch('/menu.html').then(function(res){ return res.text(); })
          .then(function(html){ var el = document.getElementById('menu-container'); if (el) el.innerHTML = html; var btn = document.querySelector('.menu-toggle'); var nav = document.getElementById('sidebar'); if (btn && nav) btn.addEventListener('click', function(){ nav.classList.toggle('open'); }); })
          .catch(function(){ /* silent */ });

        setTimeout(applyLayout, 80);

        var imgs = document.querySelectorAll('img');
        var loaded = 0;
        imgs.forEach(function(img){
          if (img.complete) {
            loaded++;
            return;
          }
          img.addEventListener('load', function(){ loaded++; if (loaded === imgs.length) setTimeout(applyLayout, 40); });
          img.addEventListener('error', function(){ loaded++; if (loaded === imgs.length) setTimeout(applyLayout, 40); });
        });
      });

    })();
  </script>
</body>
</html>
