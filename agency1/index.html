<!DOCTYPE html>

  <!-- Íconos y manifest para PWA -->

  <!-- Estilos en línea (añado el banner-manager aquí) -->
  <style>
    /* ... (resto de estilos igual, hasta donde inicia .artist-grid) ... */

    .artist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      padding: 20px;
    }
    /* Banner manager ocupa la fila completa */
    .banner-manager {
      grid-column: 1 / -1;
      position: relative;
      overflow: hidden;
      display: block;
      cursor: pointer;
      min-height: 220px;
      border-radius: 10px;
      background: #181818;
      transition: box-shadow .3s;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.18);
    }
    .banner-manager img.base,
    .banner-manager img.playing {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: opacity .3s, transform .3s, filter .3s;
    }
    .banner-manager img.playing {
      position: absolute;
      left: 0; top: 0;
      opacity: 0;
      z-index: 2;
    }
    .banner-manager:hover img.base {
      opacity: 0;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .banner-manager:hover img.playing {
      opacity: 1;
      filter: brightness(.5);
      transform: scale(1.05);
    }
    .banner-manager-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 16px 10px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: 1.9rem;
      font-family: 'horizon', sans-serif;
      opacity: 0;
      transition: opacity .3s;
      z-index: 3;
      letter-spacing: 1px;
      text-align: center;
    }
    .banner-manager:hover .banner-manager-info {
      opacity: 1;
    }

    /* Responsive: igual que artistas */
    @media (max-width: 768px) {
      .artist-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .banner-manager, .banner-manager img.base, .banner-manager img.playing {
        height: 140px;
        min-height: 140px;
        border-radius: 8px;
      }
      .banner-manager-info {
        font-size: 1.1rem;
        padding: 8px 5px;
      }
    }
    @media (max-width: 480px) {
      .artist-grid {
        grid-template-columns: 1fr;
      }
      .banner-manager, .banner-manager img.base, .banner-manager img.playing {
        height: 90px;
        min-height: 90px;
        border-radius: 7px;
      }
      .banner-manager-info {
        font-size: 1rem;
        padding: 6px 2px;
      }
    }

    /* ... (resto de estilos igual) ... */
  </style>
